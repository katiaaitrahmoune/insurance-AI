openapi: 3.0.3
info:
  title: InsuraLens API
  version: 1.0.0
  description: |
    Evidence-grounded, multi-agent claim analysis with **mandatory human approval**.

    **The AI analyzes and proposes. The human decides.** `status` is a guarded column: it changes only through the
    `update_claim` MCP tool, which is reachable only from `POST /claims/{id}/review`. Analysis can never change it.

    Authenticate with `POST /auth/login` (any work email + the demo password), then click **Authorize** and paste the token.
    Errors always use `{ "error": { "code", "message", "details?" } }`.
servers:
  - url: http://localhost:4000/api
    description: Local
tags:
  - { name: Auth }
  - { name: Claims }
  - { name: Agent pipeline, description: Run the agents and follow their progress. Never changes claim status. }
  - { name: Human review, description: The only route that reaches update_claim. }
  - { name: Evidence }
  - { name: Dashboard }
  - { name: Chat }
  - { name: System }
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Liveness + database check
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok }, service: { type: string } } } } } }
        '503': { description: Database unreachable }

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in (demo-grade)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/demo:
    post:
      tags: [Auth]
      security: []
      summary: Continue with the demo account
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out (stateless; discard the token)
      responses:
        '204': { description: Signed out }

  /claims:
    get:
      tags: [Claims]
      summary: List claims
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Search id, customer or vehicle' }
        - { name: tab, in: query, schema: { $ref: '#/components/schemas/StageFilter' }, description: 'Alias of stage (for the UI tabs)' }
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/StageFilter' } }
        - { name: priority, in: query, schema: { type: string, enum: [all, low, medium, high] } }
        - { name: status, in: query, schema: { type: string, enum: [all, PENDING, APPROVED, MORE_INFO_REQUIRED] } }
        - { name: incidentType, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, updated_at, priority, amount], default: created_at } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: A page of claims, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimList' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Claims]
      summary: Create a claim from the uploaded package
      description: Real file types are verified by magic bytes, not just the declared MIME type. The policy requires at least four photographs (CLM-002); fewer is allowed but flagged by the analysis.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CreateClaimForm' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimWithFiles' } } } }
        '413': { description: File too large }
        '422': { $ref: '#/components/responses/ValidationError' }

  /claims/{id}:
    parameters: [ { $ref: '#/components/parameters/ClaimId' } ]
    get:
      tags: [Claims]
      summary: Claim with files and the latest analysis (use after a refresh)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /claims/{id}/evidence:
    parameters: [ { $ref: '#/components/parameters/ClaimId' } ]
    post:
      tags: [Claims]
      summary: Add more files to a claim (e.g. after "request more information")
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/EvidenceForm' }
      responses:
        '201': { description: Added, content: { application/json: { schema: { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/ClaimFile' } } } } } } }
        '409': { description: Analysis or review in progress (CLAIM_BUSY), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /claims/{id}/files/{fileId}:
    parameters:
      - { $ref: '#/components/parameters/ClaimId' }
      - { name: fileId, in: path, required: true, schema: { type: string, format: uuid } }
      - { $ref: '#/components/parameters/TokenQuery' }
    get:
      tags: [Evidence]
      summary: Download/view a stored file
      description: Also accepts `?token=` so it works in `<img>` and PDF viewers.
      responses:
        '200': { description: The file, content: { '*/*': { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /claims/{id}/related-cases:
    parameters: [ { $ref: '#/components/parameters/ClaimId' } ]
    get:
      tags: [Evidence]
      summary: Related past cases from long-term memory (supporting context only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { type: object, properties: { claimId: { type: string }, memoryType: { type: string }, content: { type: string }, createdAt: { type: string, format: date-time } } } } } } } } }

  /claims/{id}/analyze:
    parameters: [ { $ref: '#/components/parameters/ClaimId' } ]
    post:
      tags: [Agent pipeline]
      summary: Start the Vision → Policy → Decision pipeline
      description: Returns immediately; follow progress on the stream. **Never calls update_claim and never changes `status`.** Allowed again after `failed` or `reviewed` (re-analysis).
      responses:
        '202': { description: Started, content: { application/json: { schema: { type: object, properties: { claim_id: { type: string }, analysis_id: { type: integer }, state: { type: string, example: running } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Already running, awaiting review, or approved (ANALYSIS_NOT_STARTABLE, CLAIM_ALREADY_APPROVED)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /claims/{id}/stream:
    parameters:
      - { $ref: '#/components/parameters/ClaimId' }
      - { $ref: '#/components/parameters/TokenQuery' }
    get:
      tags: [Agent pipeline]
      summary: Live agent progress (Server-Sent Events)
      description: |
        Replays the latest run, then streams live. Frame: `id: <analysis_id>-<seq>`, `event: <name>`, `data: <json>`.
        When `analysis_id` changes, reset the timeline. `EventSource` reconnects and resumes with `Last-Event-ID`.
        Swagger UI cannot display an open stream; use `curl -N` or `EventSource`.
      responses:
        '200': { description: Event stream, content: { text/event-stream: { schema: { $ref: '#/components/schemas/ProgressEvent' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /claims/{id}/review:
    parameters: [ { $ref: '#/components/parameters/ClaimId' } ]
    post:
      tags: [Human review]
      summary: Officer decision. The only route that calls update_claim
      description: |
        Atomically claims the review slot, calls `update_claim` through MCP, resumes the graph with the human decision,
        then writes long-term memory. `approve → APPROVED`, `request_info → MORE_INFO_REQUIRED`.
        If the tool call fails the claim returns to the review queue and retrying is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200': { description: Status changed via the MCP tool, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Not awaiting review, or already reviewed (NOT_AWAITING_REVIEW)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { description: 'update_claim failed (MCP_*); nothing changed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /sources/{sourceId}:
    parameters: [ { name: sourceId, in: path, required: true, schema: { type: string }, example: src_pol_AT-MOT-2026-X99_COV-001 } ]
    get:
      tags: [Evidence]
      summary: Resolve a citation ("View Source")
      description: Every `source_id` in an analysis (policy clause, report excerpt, claim statement, photo) resolves here.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies:
    get:
      tags: [Evidence]
      summary: Ingested policies
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Policy' } } } } } } }

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Dashboard totals, workflow counts and recent activity
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
  /analytics:
    get:
      tags: [Dashboard]
      summary: Analytics with optional filters
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: incidentType, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string, enum: [all, low, medium, high] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Analytics' } } } }
  /notifications:
    get:
      tags: [Dashboard]
      summary: Notifications
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } }, unreadCount: { type: integer } } } } } }
  /notifications/read-all:
    post:
      tags: [Dashboard]
      summary: Mark all notifications read
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { updated: { type: integer } } } } } }
  /notifications/{id}/read:
    post:
      tags: [Dashboard]
      summary: Mark one notification read
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Notification' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat/messages:
    post:
      tags: [Chat]
      summary: Send a chat message (creates a conversation if none given)
      description: '"Analyze CLM-1042" starts the same analysis as the REST route. Chat explains stored findings with sources; it cannot change status.'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatSend' } } }
      responses:
        '201': { description: User + assistant messages, content: { application/json: { schema: { $ref: '#/components/schemas/ChatSendResponse' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /chat/conversations:
    get:
      tags: [Chat]
      summary: List conversations
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Conversation' } } } } } } }
    post:
      tags: [Chat]
      summary: Create a conversation
      requestBody:
        content: { application/json: { schema: { type: object, properties: { claimId: { type: string, example: CLM-1042 }, title: { type: string } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Conversation' } } } }
  /chat/conversations/{id}:
    get:
      tags: [Chat]
      summary: Conversation with messages
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/messages:
    post:
      tags: [Chat]
      summary: Send a message in an existing conversation
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChatSend' } } }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChatSendResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ClaimId: { name: id, in: path, required: true, schema: { type: string, pattern: '^CLM-\d{3,10}$' }, example: CLM-1042 }
    TokenQuery: { name: token, in: query, required: false, schema: { type: string }, description: 'JWT, for clients that cannot set headers (EventSource, img)' }
  responses:
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RateLimited: { description: Too many requests, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_AWAITING_REVIEW }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
    User:
      type: object
      properties: { id: { type: integer }, email: { type: string }, name: { type: string }, role: { type: string, example: claims_officer } }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email, example: sarah@acme-insure.com }, password: { type: string, example: demo123 } }
    AuthResponse:
      type: object
      properties: { token: { type: string }, user: { $ref: '#/components/schemas/User' } }
    StageFilter: { type: string, enum: [all, intake, evidence_collection, ai_analysis, human_review, decided] }
    Status:
      type: string
      enum: [PENDING, APPROVED, MORE_INFO_REQUIRED]
      description: Guarded. Only update_claim changes it.
    CoverageVerdict: { type: string, enum: [covered, not_covered, partial, unclear] }
    Claim:
      type: object
      properties:
        id: { type: string, example: CLM-1042 }
        customerName: { type: string, example: John Doe }
        vehicle: { type: string, example: 2024 Fictional Motors Sedan }
        status: { $ref: '#/components/schemas/Status' }
        stage: { type: string, enum: [intake, evidence_collection, ai_analysis, human_review, decided] }
        priority: { type: string, enum: [low, medium, high] }
        incidentType: { type: string, enum: [front_end_collision, rear_end_collision, side_impact, glass_damage, theft, other] }
        estimatedAmount: { type: number, nullable: true }
        description: { type: string }
        damageSummary: { type: string, nullable: true }
        coverageStatus: { allOf: [ { $ref: '#/components/schemas/CoverageVerdict' } ], nullable: true }
        inconsistencyFlag: { type: boolean }
        policyId: { type: string, example: AT-MOT-2026-X99 }
        analysisState: { type: string, enum: [not_started, running, awaiting_review, reviewing, reviewed, failed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
    ClaimFile:
      type: object
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string }
        kind: { type: string, enum: [image, report, policy, other] }
        name: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        url: { type: string, example: /api/claims/CLM-1042/files/00000000-0000-0000-0000-000000000000 }
        createdAt: { type: string, format: date-time }
    ClaimWithFiles:
      allOf:
        - { $ref: '#/components/schemas/Claim' }
        - { type: object, properties: { files: { type: array, items: { $ref: '#/components/schemas/ClaimFile' } } } }
    ClaimDetail:
      allOf:
        - { $ref: '#/components/schemas/ClaimWithFiles' }
        - { type: object, properties: { analysis: { allOf: [ { $ref: '#/components/schemas/Analysis' } ], nullable: true } } }
    ClaimList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Claim' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        counts: { type: object, additionalProperties: { type: integer }, description: Per-stage counts for tab badges (ignores filters), example: { all: 26, intake: 5, human_review: 1 } }
    CreateClaimForm:
      type: object
      required: [customerName, vehicle]
      properties:
        customerName: { type: string, example: John Doe }
        vehicle: { type: string, example: 2024 Fictional Motors Sedan }
        description: { type: string }
        policyId: { type: string, default: AT-MOT-2026-X99 }
        priority: { type: string, enum: [low, medium, high] }
        incidentType: { type: string, enum: [front_end_collision, rear_end_collision, side_impact, glass_damage, theft, other] }
        estimatedAmount: { type: number }
        images: { type: array, maxItems: 6, items: { type: string, format: binary }, description: JPEG/PNG/WebP damage photos }
        report: { type: string, format: binary, description: Accident report (PDF or TXT) }
        policy: { type: string, format: binary, description: Policy PDF }
    EvidenceForm:
      type: object
      properties:
        images: { type: array, maxItems: 6, items: { type: string, format: binary } }
        report: { type: string, format: binary }
        policy: { type: string, format: binary }
    Damage:
      type: object
      required: [part, description, confidence]
      properties:
        part: { type: string, example: front bumper }
        description: { type: string, example: visible damage }
        confidence: { type: number, minimum: 0, maximum: 1, example: 0.91 }
        image_ref: { type: string, format: uuid, nullable: true }
        region: { type: string, nullable: true }
        needs_verification: { type: boolean, description: Set when confidence is under the threshold }
        source_id: { type: string, example: src_img_CLM-1042_front_bumper }
    VisionOutput:
      type: object
      required: [damages]
      properties: { damages: { type: array, items: { $ref: '#/components/schemas/Damage' } } }
    Citation:
      type: object
      required: [policy_id, policy_name, section, clause_quote, source_id]
      properties:
        policy_id: { type: string, example: AT-MOT-2026-X99 }
        policy_name: { type: string }
        section: { type: string, example: COV-001 }
        clause_quote: { type: string, description: Verbatim clause text }
        page: { type: integer, nullable: true }
        source_id: { type: string, example: src_pol_AT-MOT-2026-X99_COV-001 }
    PolicyOutput:
      type: object
      required: [coverage_verdict, citations, reasoning, unmatched_damage]
      description: A verdict other than `unclear` must carry at least one citation.
      properties:
        coverage_verdict: { $ref: '#/components/schemas/CoverageVerdict' }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        reasoning: { type: string }
        unmatched_damage: { type: array, items: { type: string } }
    Evidence:
      type: object
      required: [source, value]
      properties:
        source: { type: string, example: claim_description, description: 'claim_description | accident_report | claim_record | policy_schedule' }
        value: { type: string, example: 'March 12, 2026' }
        source_id: { type: string }
        excerpt: { type: string }
    Inconsistency:
      type: object
      required: [type, severity, description, evidence]
      properties:
        type: { type: string, enum: [date_mismatch, location_mismatch, damage_mismatch, missing_document, other] }
        severity: { type: string, enum: [low, medium, high] }
        description: { type: string, example: Dates differ between customer statement and official report. }
        evidence: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Evidence' } }
    DecisionOutput:
      type: object
      required: [summary, coverage, inconsistencies, missing_information, recommendation]
      properties:
        summary: { type: string }
        coverage: { $ref: '#/components/schemas/CoverageVerdict' }
        inconsistencies: { type: array, items: { $ref: '#/components/schemas/Inconsistency' } }
        missing_information: { type: array, items: { type: string } }
        recommendation: { type: string, enum: [approve, request_more_information], description: 'A recommendation, never a decision' }
        supporting_context:
          type: object
          description: Long-term memory. Supporting signal only, never the basis of the recommendation.
          properties:
            related_past_cases: { type: array, items: { type: object, properties: { claim_id: { type: string }, memory_type: { type: string }, content: { type: string } } } }
    ProgressEvent:
      type: object
      required: [claim_id, analysis_id, seq, event]
      properties:
        claim_id: { type: string }
        analysis_id: { type: integer }
        seq: { type: integer, description: Index within this run }
        ts: { type: string, format: date-time }
        event: { type: string, enum: [analysis_started, agent_status, awaiting_review, analysis_failed] }
        agent: { type: string, enum: [vision, policy, decision] }
        status: { type: string, enum: [running, completed, flagged, failed] }
        payload:
          nullable: true
          description: The agent output when completed/flagged, or `{error:{code,message}}` when failed
          oneOf:
            - { $ref: '#/components/schemas/VisionOutput' }
            - { $ref: '#/components/schemas/PolicyOutput' }
            - { $ref: '#/components/schemas/DecisionOutput' }
            - { type: object, properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } } }
        recommendation: { type: string, description: Present on awaiting_review }
        message: { type: string, description: Present on analysis_failed }
    Analysis:
      type: object
      properties:
        id: { type: integer }
        state: { type: string, enum: [running, awaiting_review, reviewed, failed] }
        vision: { allOf: [ { $ref: '#/components/schemas/VisionOutput' } ], nullable: true }
        policy: { allOf: [ { $ref: '#/components/schemas/PolicyOutput' } ], nullable: true }
        decision: { allOf: [ { $ref: '#/components/schemas/DecisionOutput' } ], nullable: true }
        events: { type: array, items: { $ref: '#/components/schemas/ProgressEvent' } }
        humanDecision: { type: object, nullable: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    ReviewRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        claim_id: { type: string, example: CLM-1042, description: Optional; must match the URL }
        action: { type: string, enum: [approve, request_info] }
    ReviewResponse:
      type: object
      properties:
        claim_id: { type: string }
        old_status: { $ref: '#/components/schemas/Status' }
        new_status: { $ref: '#/components/schemas/Status' }
        tool_call: { type: string, example: update_claim }
        tool_result: { type: object, properties: { claim_id: { type: string }, old_status: { type: string }, new_status: { type: string }, updated_at: { type: string, format: date-time } } }
        memory_saved: { type: boolean }
    Source:
      type: object
      properties:
        source_id: { type: string }
        kind: { type: string, enum: [policy_clause, report_excerpt, claim_description, image] }
        title: { type: string, example: Accidental Collision Damage (COV-001) }
        section: { type: string, nullable: true }
        page: { type: integer, nullable: true }
        quote: { type: string, nullable: true }
        claim_id: { type: string, nullable: true }
        meta: { type: object }
        file: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, mime_type: { type: string }, url: { type: string } } }
    Policy:
      type: object
      properties: { id: { type: string }, name: { type: string }, filename: { type: string }, coverage_summary: { type: string } }
    DashboardSummary:
      type: object
      properties:
        totals:
          type: object
          properties: { claims: { type: integer }, open: { type: integer }, awaitingReview: { type: integer }, approved: { type: integer }, moreInfoRequired: { type: integer }, withInconsistencies: { type: integer }, highPriorityOpen: { type: integer } }
        byStage: { type: array, items: { type: object, properties: { stage: { type: string }, count: { type: integer } } } }
        byPriority: { type: array, items: { type: object, properties: { priority: { type: string }, count: { type: integer } } } }
        recentActivity: { type: array, items: { type: object, properties: { id: { type: integer }, claimId: { type: string, nullable: true }, actor: { type: string }, action: { type: string }, message: { type: string }, createdAt: { type: string, format: date-time } } } }
    Analytics:
      type: object
      properties:
        filters: { type: object }
        summary: { type: object, properties: { totalClaims: { type: integer }, approved: { type: integer }, awaitingReview: { type: integer }, inconsistencyRate: { type: number }, avgHoursToDecision: { type: number, nullable: true }, avgAnalysisSeconds: { type: number, nullable: true } } }
        claimsPerDay: { type: array, items: { type: object, properties: { date: { type: string, format: date }, count: { type: integer } } } }
        byIncidentType: { type: array, items: { type: object, properties: { key: { type: string }, count: { type: integer } } } }
        byStage: { type: array, items: { type: object, properties: { key: { type: string }, count: { type: integer } } } }
        byStatus: { type: array, items: { type: object, properties: { key: { type: string }, count: { type: integer } } } }
    Notification:
      type: object
      properties: { id: { type: string, format: uuid }, claimId: { type: string, nullable: true }, title: { type: string }, body: { type: string }, read: { type: boolean }, createdAt: { type: string, format: date-time } }
    ChatSend:
      type: object
      required: [content]
      properties:
        content: { type: string, example: Analyze CLM-1042 }
        conversationId: { type: string, format: uuid }
        claimId: { type: string, example: CLM-1042 }
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        sources: { type: array, items: { type: object, properties: { source_id: { type: string }, title: { type: string } } } }
        meta: { type: object, description: 'e.g. { action: "analysis_started", claimId, analysisId }' }
        createdAt: { type: string, format: date-time }
    ChatSendResponse:
      type: object
      properties: { conversationId: { type: string, format: uuid }, messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } }
    Conversation:
      type: object
      properties: { id: { type: string, format: uuid }, claimId: { type: string, nullable: true }, title: { type: string }, lastMessage: { type: string, nullable: true }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    ConversationDetail:
      type: object
      properties: { id: { type: string, format: uuid }, claimId: { type: string, nullable: true }, title: { type: string }, createdAt: { type: string, format: date-time }, messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } } }
